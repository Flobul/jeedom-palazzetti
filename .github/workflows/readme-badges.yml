name: Repository badges

# Refreshes both private-repository metadata badges and Jeedom Market badges in
# one job. Combining the generators avoids a second runner, checkout, Python
# setup and competing README commits on every default-branch push. API failures
# leave README.md unchanged; a badge refresh must never turn the repository red.
# The generated commit contains [skip ci], so it does not restart the full CI.

on:
  push:
  schedule:
    # Weekly on Monday at 04:23 UTC.
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: repository-badges-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  badges:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pushes on feature branches must never write to the default branch.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test both badge generators
        run: |
          python3 .github/ci/test_market_badges.py
          python3 .github/ci/test_readme_badges.py

      - name: Refresh Market and repository badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/ci/market_badges.py
          python3 .github/ci/readme_badges.py

      - name: Commit the README when badges changed
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh repository badges [skip ci]"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
