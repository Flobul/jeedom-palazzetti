name: Translation
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate existing i18n files and placeholders
        run: python3 .github/ci/validate_i18n.py --root . --expected de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT
  translate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the documented translation secret
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then
            echo "::error::Translation blocked: repository secret DEEPL_API_KEY is not configured."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: jeedom/core
          ref: '90a95f1dcef74a65d77374a1fed427541032fe82'
          path: jeedom_core
      - uses: actions/checkout@v7
        with:
          repository: jeedom/jeetranslate
          ref: 'f16119803e0c5b74d4867ee231ba0f983db3f502'
          path: jeetranslate-tool
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: jeetranslate-tool/requirements.txt
      - name: Install pinned translator dependencies
        run: python -m pip install -r jeetranslate-tool/requirements.txt
      - name: Generate translations without overwriting existing manual values
        env:
          PYTHONPATH: ${{ github.workspace }}/jeetranslate-tool
          source_language: fr_FR
          target_languages: 'de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT'
          deepl_api_key: ${{ secrets.DEEPL_API_KEY }}
          include_empty_translation: 'true'
          use_core_translations: 'true'
          generate_source_language_translations: 'true'
          debug: 'false'
        run: python -m jeetranslate
      - name: Restore the plugin's declared language list
        run: python plugin/.github/ci/restore_i18n_languages.py --root plugin --languages de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT
      - name: Validate generated translations and placeholders
        run: python plugin/.github/ci/validate_i18n.py --root plugin --expected de_DE,en_US,es_ES,fr_FR,it_IT,pt_PT --require-languages
      - name: Open or update the translation pull request
        uses: peter-evans/create-pull-request@v8
        with:
          path: plugin
          branch: translations
          delete-branch: true
          add-paths: |
            core/i18n/*.json
            plugin_info/info.json
          title: '[CI] Update translations'
          commit-message: 'chore(i18n): update translations'
          body: |
            Translation generated by the repository-local workflow with the pinned jeedom/jeetranslate engine.
            Manual translations are reused; placeholders and JSON structure are validated before this pull request is created.
