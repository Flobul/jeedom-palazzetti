name: CI
on:
  push:
    branches:
      - Beta
  pull_request:
    branches:
      - Beta
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  php:
    uses: ./.github/workflows/check-php.yml
  frontend:
    uses: ./.github/workflows/check-frontend.yml
  jeedom:
    uses: ./.github/workflows/check-jeedom.yml
  security:
    uses: ./.github/workflows/check-security.yml
  translation:
    uses: ./.github/workflows/check-translation.yml
  report:
    name: report
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [php, frontend, jeedom, security, translation]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Test CI report generator
        run: python3 .github/ci/test_report_ci.py
      - name: Publish consolidated CI report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/ci/report_ci.py
