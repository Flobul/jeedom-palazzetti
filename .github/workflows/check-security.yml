name: Check Security
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Scan tracked files for secrets
        run: python3 .github/ci/secret_scan.py
      - name: Dependency and optional component audits
        run: bash .github/ci/dependency_audit.sh
