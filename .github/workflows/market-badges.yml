name: Market badges

# Refreshes the Jeedom market badges (rating, price, discount, purchases,
# downloads, comments) inside README.md, between the market-badges markers.
# The block is generated from https://market.jeedom.com by
# .github/ci/market_badges.py and committed only when a value actually changed,
# so the job is idempotent and stays silent on unchanged data.
#
# A plugin absent from the market, or a market outage, only produces a notice
# or a warning: it never fails the workflow.

on:
  push:
  schedule:
    # Weekly on Monday at 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: market-badges-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  badges:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Pushes on feature branches must never write to the default branch.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the badge generator
        run: python3 .github/ci/test_market_badges.py

      - name: Generate the market badge block
        run: python3 .github/ci/market_badges.py

      - name: Commit the README when the badges changed
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh Jeedom market badges [skip ci]"
          git fetch origin "${BRANCH}"
          git rebase "origin/${BRANCH}"
          git push origin "HEAD:${BRANCH}"
